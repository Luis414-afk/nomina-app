<ion-header>
  <ion-toolbar color="primary" [style.--color]="'white'">
    <ion-title>Detalle De Evento</ion-title>
    <ion-buttons slot="end" (click)="dismiss()">
      <ion-button>Cerrar</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <ion-item class="ion-activatable ripple-parent">
    <ion-label>
      <h3>Evento:</h3>
      <p>Jornada Laboral</p>
    </ion-label>
  </ion-item>

  <ion-item class="ion-activatable ripple-parent">
    <ion-label>
      <h3>Inicio:</h3>
      <p>09:00</p>
    </ion-label>
  </ion-item>
  <ion-item class="ion-activatable ripple-parent">
    <ion-label>
      <h3>Fin:</h3>
      <p>18:00</p>
    </ion-label>
  </ion-item>
  
  <ion-item class="ion-activatable ripple-parent">
    <ion-label>
      <h3>Descripción General:</h3>
      <p>Trabajo De completo de 8 horas</p>
    </ion-label>
  </ion-item>
</ion-content>
