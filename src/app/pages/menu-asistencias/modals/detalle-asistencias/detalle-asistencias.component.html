

<ion-header class="ion-no-border">
  <ion-toolbar mode="ios">
   
    <ion-title>Asistencia Detallada</ion-title>
    <ion-buttons slot="end">
 
    <ion-button color="secondary"  (click)="close()">
        <ion-icon slot="icon-only" name="close-circle"></ion-icon>
       
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>


<ion-content class="ion-padding">

  <ion-card mode="ios" class="asistencia-detalle-content ion-text-center">
  
  <div class="course-cover-image" [ngStyle]="{'background-image': 'url(assets/images/avatar/2.jpg)'}"></div>
  
  <div class="name-content ">
    <div class="top-content">
      <ion-label class="course-type">ASISTENCIA ENTRADA</ion-label>
     
 
    </div>
    
    <ion-label class="name" [ngClass]="{'correcta': estado === 1, 'incorrecta': estado === 0}">
      CORRECTA <ion-icon slot="end" name="checkmark-circle-outline"></ion-icon>
    </ion-label>

    <div class="extra-content">
      <ion-label class="detail" >
       {{currentDate}} 
        
      </ion-label>
    </div>
  </div>
</ion-card>

  <div #map id="map" class="map"></div>
</ion-content>
